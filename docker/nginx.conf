server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;
  charset_types text/plain text/markdown application/json;

  # llms.txt, llms-full.txt y las copias .md de cada página: texto plano legible desde el
  # browser y desde herramientas (curl, asistentes de código). El `types {}` vacío va
  # dentro de la location a propósito: a nivel server reemplazaría todo el mapa de MIME.
  location ~* \.md$ {
    types {}
    default_type text/markdown;
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
  }
  location ~* \.txt$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
  }

  location = /openapi/acme.json {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
  }

  # Assets con hash en el nombre. Sin `immutable` a propósito: el hash se calcula en el
  # build, antes de que 40-portal-config.sh reemplace los placeholders, así que si cambia
  # la config de un ambiente el mismo archivo cambia de contenido sin cambiar de nombre.
  location /assets/ {
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
}
